<!-- CSP 兜底防线（审查报告 9.3-1 第 4 步）

     script-src 必须显式带 unsafe-inline（单文件内联脚本、无构建步骤的必然代价）。
     其余指令仍是实打实的加固：object-src none（插件类注入）、base-uri self

<!-- 防闪烁（FOUC）：必须在 CSS 之前把 data-theme 定好，否则暗色用户会先见一帧白屏。
     这里不能调用 common.js 里的 themeGet —— 那是外部脚本，执行时机在本段之后。
     规则与 SW.themeGet 保持一致：?theme= > localStorage > 默认 light。 -->
<script>
(function(){try{
  var m=/[?&]theme=([a-z]+)/i.exec(location.search),q=m&&m[1].toLowerCase();
  var s=null;try{s=localStorage.getItem('sw-theme')}catch(e){}
  var t=(q==='dark'||q==='light')?q:((s==='dark'||s==='light')?s:'light');
  var r=document.documentElement;
  r.setAttribute('data-theme',t);
  r.style.colorScheme=(t==='dark')?'dark':'light';
}catch(e){}})();
</script>
<style>
/* ══════════════════════════════════════════════════════════════
   主题：明亮（daylight，默认） / 暗色（?theme=dark 或右上角切换）
   - 明亮值写在 :root；暗色只在 html[data-theme="dark"] 下覆盖
   - 颜色语义只经变量暴露，JS 里需要随主题变的颜色走 SW.themePalette
   - 新增变量（--chrome/--scrim/--tile-edge/--legend-mid/--shadow…）
     是为了收口原来散落的 15 处「暗色专用 rgba」，它们换成明亮主题后会失效
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 层次：纸 → 卡片 → 内嵌 */
  --bg:#fbfcfd; --bg-elev:#ffffff; --surface:#f4f6f8; --surface-2:#eef1f4;
  /* 线条：明亮主题的边界全靠它 */
  --border:#e3e8ed; --border-strong:#cfd6de;
  /* 文字三级（对比度 15.9 / 7.9 / 4.6） */
  --text:#14181d; --text-muted:#4a5460; --text-dim:#66717e;
  /* 涨跌：A 股红涨绿跌，语义不变，只降饱和（作文字 4.6:1 / 4.9:1） */
  --up:#d13438; --up-dim:rgba(209,52,56,.08); --up-line:rgba(209,52,56,.32);
  --down:#0b7d59; --down-dim:rgba(11,125,89,.08); --down-line:rgba(11,125,89,.32);
  --flat:#8892a0;
  /* 强调色：浅底加深（白字 5.2:1） */
  --accent:#4a55c8; --accent-hover:#3d47b4;
  --accent-dim:rgba(74,85,200,.08); --accent-line:rgba(74,85,200,.28);
  --accent-text:#3f49b0;
  /* 主题相关的中性填充 */
  --chrome:rgba(251,252,253,.86);   /* 顶栏/控制条半透明底 */
  --scrim:rgba(16,24,40,.28);       /* 抽屉遮罩 */
  --tile-edge:rgba(16,24,40,.06);   /* 热力块描边 */
  --tile-hover-edge:rgba(16,24,40,.18);
  --tile-hover-shadow:0 4px 12px rgba(16,24,40,.09);
  --tile-hover-filter:brightness(.97);
  --legend-mid:#e8ecf0;             /* 图例渐变中段 */
  --seg-shadow:0 1px 2px rgba(16,24,40,.10);
  --panel-shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.04);
  --drawer-shadow:-8px 0 40px rgba(16,24,40,.10);

  --font:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --gutter:20px; --maxw:1560px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dark"]{
  --bg:#0a0b0d; --bg-elev:#101114; --surface:#16181c; --surface-2:#1c1f24;
  --border:#23262c; --border-strong:#2f333a;
  --text:#e8eaed; --text-muted:#8b9199; --text-dim:#5f666e;
  --up:#ff4d4f; --up-dim:rgba(255,77,79,.14); --up-line:rgba(255,77,79,.5);
  --down:#00c48c; --down-dim:rgba(0,196,140,.14); --down-line:rgba(0,196,140,.5);
  --flat:#4a4f57;
  --accent:#5e6ad2; --accent-hover:#6b76da;
  --accent-dim:rgba(94,106,210,.12); --accent-line:rgba(94,106,210,.35);
  --accent-text:#a9b0e0;
  --chrome:rgba(10,11,13,.88);
  --scrim:rgba(0,0,0,.62);
  --tile-edge:rgba(255,255,255,.06);
  --tile-hover-edge:rgba(255,255,255,.3);
  --tile-hover-shadow:0 6px 20px rgba(0,0,0,.5);
  --tile-hover-filter:brightness(1.08);
  --legend-mid:#2a2e34;
  --seg-shadow:0 1px 2px rgba(0,0,0,.3);
  --panel-shadow:none;
  --drawer-shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14px;line-height:1.5;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--accent);color:#fff}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:60;
  background:var(--chrome);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.bar{display:flex;align-items:center;gap:18px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;white-space:nowrap;flex:none}
.brand-mark{
  width:24px;height:24px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;
}
.bar-spacer{flex:1}
.market-strip{display:flex;gap:16px;font-size:12.5px;color:var(--text-muted);white-space:nowrap}
.market-strip b{font-weight:500;font-family:var(--mono)}
.live{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border:1px solid var(--border-strong);border-radius:100px;
  font-size:11.5px;color:var(--text-muted);background:var(--bg-elev);flex:none;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px var(--down-dim);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── 主题切换 ── */
.theme-sw{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border:1px solid var(--border-strong);border-radius:100px;
  font-size:11.5px;color:var(--text-muted);background:var(--bg-elev);flex:none;
  transition:color .16s var(--ease),border-color .16s var(--ease),background-color .16s var(--ease);
}
.theme-sw:hover{color:var(--text);border-color:var(--accent-line);background:var(--accent-dim)}
.theme-sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){ .theme-sw span{display:none} .theme-sw{padding:0 8px} }

/* ── 控制条 ── */
.controls{
  position:sticky;top:56px;z-index:50;
  background:var(--chrome);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:11px 0;
}
.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{
  padding:6px 13px;border-radius:4px;font-size:12.5px;color:var(--text-muted);
  transition:background-color .16s var(--ease),color .16s var(--ease);white-space:nowrap;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:var(--seg-shadow)}
.search{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  transition:border-color .16s var(--ease);min-width:190px;flex:1;max-width:280px;
}
.search:focus-within{border-color:var(--border-strong)}
.search svg{flex:none;color:var(--text-dim)}
.search input{
  background:none;border:none;outline:none;color:var(--text);
  font-size:13px;font-family:inherit;width:100%;padding:0;
}
.search input::placeholder{color:var(--text-dim)}
.hint{font-size:12px;color:var(--text-dim);margin-left:auto;white-space:nowrap}

/* ── 概览卡 ── */
.overview{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin:18px 0;
}
.ov{background:var(--bg-elev);padding:15px 17px}
.ov-label{font-size:11.5px;color:var(--text-dim);margin-bottom:7px;letter-spacing:.02em}
.ov-val{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.03em}
.ov-sub{font-size:11.5px;color:var(--text-dim);margin-top:5px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-muted)}

/* ── 热力图 ── */
.panel{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:18px;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 17px;border-bottom:1px solid var(--border);
}
.panel-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.panel-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-weight:400}
.legend{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-dim);white-space:nowrap}
.legend-bar{
  width:104px;height:7px;border-radius:100px;
  background:linear-gradient(90deg,var(--down) 0%,var(--legend-mid) 50%,var(--up) 100%);
}
#treemap{padding:6px}
.tile-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:4px;
}

.tile{
  border-radius:var(--r-sm);overflow:hidden;cursor:pointer;
  border:1px solid var(--tile-edge);padding:9px 10px;
  min-height:66px;
  transition:transform .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease),filter .16s var(--ease);
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
}
.tile:hover{transform:translateY(-2px);border-color:var(--tile-hover-edge);box-shadow:var(--tile-hover-shadow);z-index:5;filter:var(--tile-hover-filter)}
.tile:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tile:active{transform:translateY(0)}
.tile-name{
  font-size:12px;font-weight:600;line-height:1.25;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-all;
}
.tile-flow{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.03em;line-height:1.1}

/* ── 排行表 ── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
thead th{
  position:sticky;top:0;background:var(--bg-elev);
  padding:10px 14px;text-align:right;font-weight:500;font-size:11.5px;
  color:var(--text-dim);letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;
}
thead th:first-child,thead th:nth-child(2){text-align:left}
tbody td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td:first-child,tbody td:nth-child(2){text-align:left}
tbody tr{transition:background-color .14s var(--ease)}
tbody tr:hover{background:var(--surface)}
/* 键盘可操作行（审查报告 6.5 P2：表格行原来只能点击） */
tbody tr{cursor:pointer;transition:background-color .14s var(--ease)}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
tbody tr:active{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.rank{font-family:var(--mono);color:var(--text-dim);font-size:12px;width:46px}
.ind-name{font-weight:500}
.ind-code{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-left:7px}
.l1-tag{
  display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-muted);
}
.bar-cell{width:130px}
.bar-track{height:5px;border-radius:100px;background:var(--surface-2);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:100px;transition:width .35s var(--ease)}

/* ── 抽屉 ── */
.scrim{
  position:fixed;inset:0;background:var(--scrim);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);
  background:var(--bg-elev);border-left:1px solid var(--border);z-index:101;
  transform:translateX(100%);transition:transform .3s var(--ease);
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer-head{padding:19px 22px;border-bottom:1px solid var(--border);flex:none}
.drawer-title{font-size:19px;font-weight:600;letter-spacing:-.025em;margin-bottom:5px}
.drawer-meta{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1}
.jump-link{
  position:absolute;top:20px;right:58px;font-size:12px;color:var(--text-muted);
  padding:6px 11px;border:1px solid var(--border);border-radius:var(--r-sm);
  transition:all .16s var(--ease);white-space:nowrap;
}
.jump-link:hover{color:var(--accent-text);border-color:var(--accent-line);background:var(--accent-dim)}
@media (max-width:560px){ .jump-link{display:none} }
.drawer-close{
  position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--text-muted);border:1px solid transparent;
  transition:background-color .16s var(--ease),color .16s var(--ease);
}
.drawer-close:hover{background:var(--surface);color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-of-type{border-bottom:none}
.kv .k{color:var(--text-dim)}
.kv .v{font-family:var(--mono);font-weight:500}
.sec-t{font-size:11.5px;color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;margin:22px 0 11px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:5px 11px;border:1px solid var(--border);border-radius:100px;
  font-size:12.5px;background:var(--surface);color:var(--text-muted);
}
.flow-big{font-family:var(--mono);font-size:29px;font-weight:600;letter-spacing:-.035em;margin-bottom:3px}
.empty{padding:60px 20px;text-align:center;color:var(--text-dim);font-size:13px}

footer{
  border-top:1px solid var(--border);margin-top:26px;padding:22px 0;
  font-size:12px;color:var(--text-dim);
}
.foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.warn{
  display:flex;align-items:flex-start;gap:9px;padding:12px 15px;margin-bottom:18px;
  background:var(--accent-dim);border:1px solid var(--accent-line);
  border-radius:var(--r);font-size:12.5px;color:var(--accent-text);line-height:1.6;
}
.warn b{color:var(--accent-text);font-weight:600}

@media (max-width:1080px){
  .overview{grid-template-columns:repeat(2,1fr)}
  .hint{display:none}
}
@media (max-width:760px){
  :root{--gutter:14px}
  .market-strip{display:none}
  .controls{top:56px}
  .overview{grid-template-columns:repeat(2,1fr);margin:14px 0}
  .ov{padding:12px 13px}
  .ov-val{font-size:17px}
  #treemap{min-height:340px}
  .search{max-width:none;flex:1 1 100%}
  .bar{height:52px}
  .controls{top:52px}
  .drawer{width:100%}
}
/* 窄屏顶栏收口：.live 的内容宽 ~200px 且 flex:none，叠加 brand / 控制台 / 主题按钮
   会把 .bar 撑到 514px（390 视口实测），主题按钮被挤出可视区点不到。
   body 的 overflow-x:hidden 只掩盖视觉，documentElement.scrollWidth 仍暴露溢出。
   —— 2026-10-19 theme-check.js 实测发现（docs/09 §4.1 当时按 body 口径未测出）。 */
@media (max-width:560px){
  .bar{gap:10px}
  .live{min-width:0;flex:0 1 auto;overflow:hidden;padding:0 8px}
  .live #liveText{display:none}   /* 状态点保留，文字让位给主题按钮 */
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ── 返回控制台 ── */
.back-admin{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 12px;border-radius:6px;
  border:1px solid var(--border);background:var(--surface);
  font-size:12.5px;color:var(--text-muted);flex:none;
  transition:all .16s cubic-bezier(.22,.61,.36,1);
  text-decoration:none;white-space:nowrap;
}
.back-admin:hover{color:var(--accent-text);border-color:var(--accent-line);background:var(--accent-dim)}
.back-admin svg{flex:none}
@media (max-width:640px){ .back-admin span{display:none} .back-admin{padding:0 10px} }

</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <span class="brand-mark">申</span>
      <span>申万二级行业资金流</span>
    </div>
    <div class="bar-spacer"></div>
    <a class="back-admin" href="/admin.html" title="返回数据管理控制台">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg><span>控制台</span></a>
    <div class="market-strip">
      <span>沪指 <b id="mSh">—</b></span>
      <span>深成 <b id="mSz">—</b></span>
      <span>两市成交 <b id="mAmt">—</b></span>

<script>
/* ══════ 数据 ══════ */
/* 注：原文件此处内嵌了一个 const SW = [...] 静态申万行业数组，共 11,233 字符
   （占本文件 44,494 B 的 25%），已不再被任何代码引用 ——
   f/g 数据全部来自后端 /api/v1/industries（审查报告 6.1 P1 / 6.3 P1）。已删除。 */

/* ══════ 资金流（真实数据，来自后端 API）══════ */
let IND = [];
let DATA_DATE = null;
let META = null;

/* 由 /industries 列表项构建内部结构。
   ⚠ 关键修复（审查报告 6.1 P1）：原实现的 strength 恒定用 todayMain/turnover
   （当日主力口径），完全不理周期选择器 —— 用户切到「10 日」后表格数字会变、
   占比列却不变。现在按周期分别预计算 1/5/10 日口径的占比。 */
function buildIND(list){
  return list.map(x => {
    const amt = fnum(x.turnover, 0);
    const f = {1: fnum(x.todayMain, 0), 5: fnum(x.main5d, 0), 10: fnum(x.main10d, 0)};
    /* 净额（非主力）：用于表头「净流入」列的独立口径，避免与主力混淆 */
    const nf = {1: fnum(x.todayNet, 0), 5: fnum(x.net5d, 0), 10: fnum(x.net10d, 0)};
    /* 占比 = 该周期主力净额 ÷ 当日成交额（成交额只有当日值，故为近似口径，
       这一点在界面上明确标注，不再让用户误以为它随周期精确变化） */
    const ratio = {};
    [1,5,10].forEach(function(p){ ratio[p] = amt > 0 ? f[p]/amt : null; });
    return {
      code: x.swCode, name: x.name, l1: x.l1Name, n: x.memberCount,
      top: x.topStocks || [],
      amt: amt,
      f: f, nf: nf, ratio: ratio,
      /* strength 保留为「当日」口径，兼容旧引用 */
      strength: amt > 0 ? f[1]/amt : null
    };
  });
}

async function init(){
  const box = document.getElementById('treemap');
  try {
    const [listRes, metaRes] = await Promise.all([
      api('/api/v1/industries?level=2&page_size=500'),
      api('/api/v1/meta').catch(()=>null),
    ]);
    IND = buildIND(listRes.list || []);
    if(metaRes && metaRes.dataEnd){
      DATA_DATE = metaRes.dataEnd;
      META = metaRes;
    }
    const live = document.getElementById('liveText');
    if(live) live.textContent = '真实数据' + (DATA_DATE ? ' · 数据日期 ' + DATA_DATE : '');
    const mAmt = document.getElementById('mAmt');
    if(mAmt){
      const total = IND.reduce((s,x)=>s+(x.amt||0), 0);
      mAmt.textContent = (total/10000).toFixed(2) + ' 万亿';
    }
    render();
  } catch(e){
    box.innerHTML = '<div class="empty">数据加载失败：' + esc(e.message) + '<br>' +
      '请确认后端服务已启动（127.0.0.1:8000）。</div>';
    const live = document.getElementById('liveText');
    if(live) live.textContent = '数据加载失败';
  }
}

let period = 1, view = 'map', query = '';

/* ══════ 工具 ══════
   esc / fmtAmt / fmtYi / cls / pctStr 由 common.js 提供。
   ⚠ 阈值修复（审查报告 6.7）：本页原来用 0.02，而 industry.html 与 admin.html
   用 0.005 —— 同一个值在两张页面会被判成不同档位。现统一到 SW.THRESHOLD。 */

/* 该周期下的占比（可能为 null＝成交额缺失） */
function ratioOf(x){ const r = x.ratio[period]; return (r == null) ? null : r; }
function ratioStr(x){
  const r = ratioOf(x);
  return r == null ? '—' : pctStr(r * 100);
}

/* 颜色档位（6 级）—— 两套主题各一组
   ⚠ 明亮主题不能沿用暗色那套「同色相叠透明度」：白底上会糊成脏粉色。
   ⚠ 每一档的文字色按 WCAG AA（≥4.5:1）逐档实测选定，不是随手填的：
       透明度 10/20/32/50 → 用深字（深色 #6b171c / #043626）
       透明度 80/100      → 用白字
     中间不存在「深字白字都不达标」的档位（这是一开始按 .28/.44/.64/.82
     排时出现的问题：第 5 档深字 2.89、白字 3.6，两边都过不了）。
     实测（对纯白底合成后）：红 10.08/8.47/6.79/4.77/4.58/6.41，
                              绿 11.52/9.77/7.91/5.60/4.62/7.38。
   ⚠ 平盘兜底色由 CSS 变量给出（JS 生成的内联 style 里 var() 同样生效）。 */
const TILE_STEPS = {
  light: {
    up: [['rgba(184,32,42,.10)','#6b171c'], ['rgba(184,32,42,.20)','#6b171c'],
         ['rgba(184,32,42,.32)','#6b171c'], ['rgba(184,32,42,.50)','#6b171c'],
         ['rgba(184,32,42,.80)','#ffffff'], ['rgba(184,32,42,1)','#ffffff']],
    dn: [['rgba(8,98,70,.10)','#043626'], ['rgba(8,98,70,.20)','#043626'],
         ['rgba(8,98,70,.32)','#043626'], ['rgba(8,98,70,.50)','#043626'],
         ['rgba(8,98,70,.80)','#ffffff'], ['rgba(8,98,70,1)','#ffffff']],
    flat: ['var(--surface-2)','var(--text-muted)']
  },
  dark: {
    up: [['rgba(255,77,79,.16)','#ffd9d9'], ['rgba(255,77,79,.28)','#ffd0d0'],
         ['rgba(255,77,79,.45)','#ffc4c4'], ['rgba(255,77,79,.64)','#ffb8b8'],
         ['rgba(255,77,79,.82)','#fff'], ['rgba(255,77,79,1)','#fff']],
    dn: [['rgba(0,196,140,.16)','#c9f7e8'], ['rgba(0,196,140,.28)','#bdf4e2'],
         ['rgba(0,196,140,.45)','#a9efda'], ['rgba(0,196,140,.64)','#93e9d0'],
         ['rgba(0,196,140,.82)','#fff'], ['rgba(0,196,140,1)','#fff']],
    flat: ['var(--surface-2)','var(--text-muted)']
  }
};
function tileColor(v, maxAbs){
  const S = TILE_STEPS[themeIsDark() ? 'dark' : 'light'];
  if(Math.abs(v)<0.01) return S.flat;
  const t = Math.min(Math.abs(v)/maxAbs, 1);
  const idx = Math.min(Math.floor(t*6), 5);
  return v>0 ? S.up[idx] : S.dn[idx];
}
function barColor(v){
  return v>0 ? 'var(--up)' : (v<0 ? 'var(--down)' : 'var(--flat)');
}

/* ══════ 筛选 ══════ */
function filtered(){
  const q = query.trim().toLowerCase();
  if(!q) return IND;
  return IND.filter(x =>
    x.name.toLowerCase().includes(q) ||
    x.code.includes(q) ||
    x.l1.toLowerCase().includes(q) ||
    x.top.some(t=>t.toLowerCase().includes(q))
  );
}

/* ══════ 热力图（squarified treemap）══════ */
function renderMap(){
  const box = document.getElementById('treemap');
  const list = filtered().slice().sort((a,b)=>b.f[period]-a.f[period]);
  if(!list.length){ box.innerHTML='<div class="empty">没有匹配的行业</div>'; return; }

  const maxAbs = Math.max(...list.map(i=>Math.abs(i.f[period])), 1);
  /* ⚠ XSS 修复（审查报告 6.2.1）：本页原来完全没有转义助手（esc( 命中 0）。
     这里尤其危险 —— title="..." 是**属性上下文**，未转义的引号可以闭合属性
     并注入新属性/事件处理器，比纯文本注入更容易得手。 */
  box.innerHTML = `<div class="tile-grid">` + list.map(t=>{
    const v = t.f[period], [bg,fg] = tileColor(v, maxAbs);
    const title = t.name + '　' + fmtYi(v) + '　' + t.l1;
    return `<div class="tile" data-code="${escAttr(t.code)}" style="background:${bg};color:${fg}"
      title="${escAttr(title)}" tabindex="0" role="button"
      aria-label="${escAttr(title + '，' + ratioStr(t) + ' 净流入占比，查看详情')}">
      <div class="tile-name">${esc(t.name)}</div>
      <div class="tile-flow">${fmtAmt(v)}</div>
    </div>`;
  }).join('') + `</div>`;
}

/* ══════ 排行表 ══════ */
function renderTable(){
  const list = filtered().slice().sort((a,b)=>b.f[period]-a.f[period]);
  const maxAbs = Math.max(...list.map(i=>Math.abs(i.f[period])), 1);
  document.getElementById('tbody').innerHTML = list.map((x,i)=>{
    const v = x.f[period], w = Math.min(Math.abs(v)/maxAbs*100,100);
    return `<tr data-code="${escAttr(x.code)}" tabindex="0">
      <td class="rank">${i+1}</td>
      <td><span class="ind-name">${esc(x.name)}</span><span class="ind-code">${esc(x.code)}</span></td>
      <td><span class="l1-tag">${esc(x.l1)}</span></td>
      <td class="num" style="color:var(--text-dim)">${fnum(x.n,0)}</td>
      <td class="num ${cls(v)}" style="font-weight:600">${fmtYi(v)}</td>
      <td class="num ${cls(ratioOf(x))}">${ratioStr(x)}</td>
      <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${barColor(v)}"></div></div></td>
    </tr>`;
  }).join('');
  document.getElementById('rowCount').textContent = `共 ${list.length} 个行业`;
}

/* ══════ 概览 ══════ */
function renderOverview(){
  const list = filtered();
  if(!list.length){
    ['ovIn','ovOut','ovNet','ovExtreme'].forEach(id=>document.getElementById(id).textContent='—');
    return;
  }
  const inN = list.filter(x=>x.f[period]>0).length;
  const outN = list.filter(x=>x.f[period]<0).length;
  const net  = list.reduce((s,x)=>s+x.f[period],0);
  const sorted = list.slice().sort((a,b)=>b.f[period]-a.f[period]);
  const best = sorted[0], worst = sorted[sorted.length-1];

  document.getElementById('ovIn').textContent = inN;
  document.getElementById('ovInSub').textContent = `占比 ${(inN/list.length*100).toFixed(0)}%`;
  document.getElementById('ovOut').textContent = outN;
  document.getElementById('ovOutSub').textContent = `占比 ${(outN/list.length*100).toFixed(0)}%`;
  const netEl = document.getElementById('ovNet');
  netEl.textContent = fmtYi(net);
  netEl.className = 'ov-val ' + cls(net);
  /* ⚠ XSS 修复：best.name / worst.name 是上游来的行业名 */
  document.getElementById('ovExtreme').innerHTML =
    `<span class="up">${esc(best.name)}</span> <span style="color:var(--text-dim);font-size:13px">/</span> <span class="down">${esc(worst.name)}</span>`;
  document.getElementById('ovExtremeSub').textContent =
    `${fmtAmt(best.f[period])}亿 / ${fmtAmt(worst.f[period])}亿`;
}

/* ══════ 抽屉 ══════ */
let _lastFocus = null;
function openDrawer(code){
  const x = IND.find(i=>i.code===code); if(!x) return;
  const v = x.f[period];
  document.getElementById('dTitle').textContent = x.name;
  /* ⚠ XSS 修复（审查报告 6.2.1）：整段原来零转义，包括第 549 行的成分股名
     （来自 t_stock_basic.name，同样源自明文 HTTP 上游）。 */
  document.getElementById('dMeta').innerHTML =
    `<span class="l1-tag">${esc(x.l1)}</span><span class="num">${esc(x.code)}</span><span>成分股 ${fnum(x.n,0)} 只</span>`;
  const r = ratioOf(x);
  document.getElementById('dBody').innerHTML = `
    <div class="flow-big ${cls(v)}">${fmtYi(v)}</div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:20px">
      ${period===1?'今日':period+'日'}主力净流入
    </div>

    <div class="kv"><span class="k">净流入占比（${period===1?'今日':period+'日'}主力 ÷ 当日成交额）</span><span class="v ${cls(r)}">${r==null?'—':pctStr(r*100)}</span></div>
    <div class="kv"><span class="k">成交额（当日）</span><span class="v">${numToFixed(x.amt,1)} 亿</span></div>
    <div class="kv"><span class="k">净流入（非主力口径）</span><span class="v ${cls(x.nf[period])}">${fmtYi(x.nf[period])}</span></div>
    <div class="kv"><span class="k">主力·5 日</span><span class="v ${cls(x.f[5])}">${fmtYi(x.f[5])}</span></div>
    <div class="kv"><span class="k">主力·10 日</span><span class="v ${cls(x.f[10])}">${fmtYi(x.f[10])}</span></div>
    <div class="sec-t">代表个股</div>
    <div class="chips">${x.top.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
    <div class="sec-t">归属</div>
    <div class="kv"><span class="k">一级行业</span><span class="v">${esc(x.l1)}</span></div>
    <div class="kv"><span class="k">二级代码</span><span class="v">${esc(x.code)}</span></div>
  `;
  const link = document.getElementById('dClassLink');
  if(link) link.href = 'industry.html?ind=' + escUrl(code) + '&name=' + escUrl(x.name);
  _lastFocus = document.activeElement;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('dClose').focus();
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  /* 焦点恢复（审查报告 6.5 P2：本页抽屉原缺焦点陷阱/恢复，可对照 industry.html 正例） */
  if(_lastFocus && _lastFocus.isConnected) _lastFocus.focus();
  _lastFocus = null;
}

/* 焦点陷阱：抽屉打开时 Tab 循环限制在抽屉内 */
function trapFocus(e){
  if(e.key !== 'Tab') return;
  const drawer = document.getElementById('drawer');
  if(!drawer.classList.contains('open')) return;
  const focusables = [...drawer.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )].filter(el => el.offsetParent !== null);
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* ══════ 渲染调度 ══════ */
function render(){
  const n = filtered().length;
  document.getElementById('hint').textContent =
    query ? `匹配 ${n} / ${IND.length} 个行业` : `共 ${IND.length} 个二级行业`;
  renderOverview();
  if(view==='map') renderMap(); else renderTable();
}

/* ══════ 事件 ══════ */
document.getElementById('periodSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  period = +b.dataset.p;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  document.getElementById('tableSub').textContent =
    `按${period===1?'今日':period+'日'}主力净流入排序`;
  /* 表头与占比列同步标注周期 —— 占比现在跟随所选周期（审查报告 6.1 P1） */
  const ths = document.querySelectorAll('#tablePanel thead th');
  if(ths[4]) ths[4].textContent = (period===1?'今日':period+'日') + '主力净流入';
  if(ths[5]) ths[5].textContent = '净流入占比';
  render();
});
document.getElementById('viewSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  view = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  document.getElementById('mapPanel').hidden = view!=='map';
  document.getElementById('tablePanel').hidden = view!=='table';
  render();
  /* 原实现在切到地图时重复渲染两次（render 内已经 renderMap，这里又调一次，
     见审查报告 6.3 P2）。已删除多余的这一次。 */
});

let tq;
document.getElementById('q').addEventListener('input', e=>{
  clearTimeout(tq);
  tq = setTimeout(()=>{ query = e.target.value; render(); }, 120);
});

/* 键盘可操作性（审查报告 6.5 P2）：热力图 tile 与表格行原来只能点击，
   无法用键盘操作。现在它们带 tabindex 与 role="button"，并支持 Enter / Space。 */
function activate(e, node){
  if(!node) return;
  if(e.type === 'click' || e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
    if(e.type === 'keydown') e.preventDefault();
    openDrawer(node.dataset.code);
  }
}
document.getElementById('treemap').addEventListener('click', e=>{
  activate(e, e.target.closest('.tile'));
});
document.getElementById('treemap').addEventListener('keydown', e=>{
  activate(e, e.target.closest('.tile'));
});
document.getElementById('tbody').addEventListener('click', e=>{
  activate(e, e.target.closest('tr'));
});
document.getElementById('tbody').addEventListener('keydown', e=>{
  activate(e, e.target.closest('tr'));
});
document.getElementById('dClose').addEventListener('click', closeDrawer);
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', trapFocus);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

/* ══════ 主题 ══════
   色阶由 JS 生成（tileColor 读 themeGet()），所以切主题后必须重绘，
   否则热力块会停留在旧主题的配色上。 */
/* themeIsDark(): common.js may still be an older cached copy without the theme
   module. Calling themeGet() unconditionally throws a ReferenceError at module
   level, which aborts this entire <script> block — init() then never runs and
   the page stays on its placeholder. Keep every theme call behind typeof. */
function themeIsDark(){
  return (typeof themeGet === 'function') && themeGet() === 'dark';
}
function syncThemeBtn(){
  const dark = themeIsDark();
  const btn = document.getElementById('themeSw');
  if(!btn) return;
  btn.setAttribute('aria-pressed', String(dark));
  btn.title = dark ? '切换到明亮主题' : '切换到暗色主题';
  const t = document.getElementById('themeSwText');
  if(t) t.textContent = dark ? '明亮' : '暗色';
}
(function bindTheme(){
  const btn = document.getElementById('themeSw');
  if(btn) btn.addEventListener('click', function(){ if (typeof themeToggle === 'function') themeToggle(); });
  if (typeof onThemeChange === 'function') onThemeChange(function(){ syncThemeBtn(); render(); });
  syncThemeBtn();
})();



/* ══════ 启动 ══════ */
init();
</script>
