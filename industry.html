<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申万行业分类 · 行业与个股浏览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0d; --bg-elev:#101114; --surface:#16181c; --surface-2:#1c1f24; --surface-3:#23272d;
  --border:#23262c; --border-strong:#2f333a;
  --text:#e8eaed; --text-muted:#8b9199; --text-dim:#5f666e;
  --up:#ff4d4f; --up-dim:rgba(255,77,79,.14); --up-line:rgba(255,77,79,.45);
  --down:#00c48c; --down-dim:rgba(0,196,140,.14); --down-line:rgba(0,196,140,.45);
  /* 四档配色：冷 → 暖渐进 */
  --q-sm:#5b8def; --q-md:#2fb8c6; --q-lg:#f5a524; --q-elg:#f2436b;
  --accent:#5e6ad2; --accent-dim:rgba(94,106,210,.14); --accent-line:rgba(94,106,210,.35);
  --font:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-muted)}

/* 顶栏 */
header{position:sticky;top:0;z-index:60;background:rgba(10,11,13,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:16px;height:56px;max-width:1400px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;white-space:nowrap;flex:none}
.brand-mark{width:24px;height:24px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.bar-spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  transition:border-color .16s var(--ease);width:280px}
.search:focus-within{border-color:var(--border-strong)}
.search svg{flex:none;color:var(--text-dim)}
.search input{background:none;border:none;outline:none;color:var(--text);
  font-size:13px;font-family:inherit;width:100%;padding:0}
.search input::placeholder{color:var(--text-dim)}

/* 布局 */
main{max-width:1400px;margin:0 auto;padding:18px 20px 40px}
.warn{display:flex;align-items:flex-start;gap:9px;padding:12px 15px;margin-bottom:18px;
  background:var(--accent-dim);border:1px solid var(--accent-line);border-radius:var(--r);
  font-size:12.5px;color:#a9b0e0;line-height:1.6}
.warn b{color:#c3c8f0;font-weight:600}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{padding:6px 13px;border-radius:4px;font-size:12.5px;color:var(--text-muted);
  transition:background-color .16s var(--ease),color .16s var(--ease);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn-sm{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);font-size:12.5px;color:var(--text-muted);
  transition:background-color .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease)}
.btn-sm:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.stat-inline{font-size:12.5px;color:var(--text-dim);margin-left:auto;white-space:nowrap}
.stat-inline b{color:var(--text-muted);font-family:var(--mono);font-weight:500}

/* 行业树 */
.tree{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.l1{border-bottom:1px solid var(--border)}
.l1:last-child{border-bottom:none}
.l1-head{display:flex;align-items:center;gap:11px;width:100%;padding:14px 18px;
  transition:background-color .15s var(--ease);text-align:left}
.l1-head:hover{background:var(--surface)}
.caret{width:13px;height:13px;flex:none;color:var(--text-dim);transition:transform .2s var(--ease)}
[aria-expanded="true"] > .l1-head .caret,
[aria-expanded="true"] > .l2-head .caret{transform:rotate(90deg)}
.l1-name{font-size:15px;font-weight:600;letter-spacing:-.015em}
.l1-code{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.count{margin-left:auto;font-size:12px;color:var(--text-dim);font-family:var(--mono);flex:none}
.l1-body,.l2-body,.l3-body{display:none}
.l1[data-open="1"] > .l1-body,
.l2[data-open="1"] > .l2-body,
.l3[data-open="1"] > .l3-body{display:block}
.l2{border-top:1px solid var(--border)}
.l2-head{display:flex;align-items:center;gap:10px;width:100%;padding:11px 18px 11px 40px;
  transition:background-color .15s var(--ease);text-align:left}
.l2-head:hover{background:var(--surface)}
.l2-name{font-size:13.5px;font-weight:500}
.l2-code{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.l3{border-top:1px solid var(--border)}
.l3-head{display:flex;align-items:center;gap:10px;width:100%;padding:9px 18px 9px 62px;
  transition:background-color .15s var(--ease);text-align:left}
.l3-head:hover{background:var(--surface)}
.l3-name{font-size:13px;color:var(--text-muted)}
.tag-l3{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);flex:none}

/* 股票网格 */
.stocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:1px;background:var(--bg-elev);border-top:1px solid var(--border)}
.stocks > .stock{box-shadow:0 0 0 1px var(--border)}
.stock{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 74px;
  background:var(--bg-elev);transition:background-color .14s var(--ease);text-align:left;width:100%}
.stock:hover{background:var(--surface-2)}
.stock-code{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);flex:none}
.stock-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:52px}
.ex{font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid var(--border);
  color:var(--text-dim);flex:none;margin-left:auto}
.hit{background:rgba(94,106,210,.1)}
mark{background:rgba(94,106,210,.3);color:#cfd4ff;border-radius:2px;padding:0 1px}
.stub-empty{padding:14px 20px 14px 74px;color:var(--text-dim);font-size:12.5px}
.empty{padding:56px 20px;text-align:center;color:var(--text-dim);font-size:13px}

/* 抽屉 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:100;opacity:0;
  pointer-events:none;transition:opacity .24s var(--ease);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);
  background:var(--bg-elev);border-left:1px solid var(--border);z-index:101;
  transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);flex:none;position:relative}
.drawer-title{font-size:21px;font-weight:600;letter-spacing:-.025em;margin-bottom:6px}
.drawer-meta{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drawer-body{padding:20px 24px 32px;overflow-y:auto;flex:1}
.drawer-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--text-muted);border:1px solid transparent;
  transition:background-color .16s var(--ease),color .16s var(--ease)}
.drawer-close:hover{background:var(--surface);color:var(--text)}

/* 个股资金流 */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.sum-c{background:var(--surface);padding:14px 16px}
.sum-l{font-size:11.5px;color:var(--text-dim);margin-bottom:6px}
.sum-v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.03em}
.range-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.range-bar .lbl{font-size:12.5px;color:var(--text-dim);margin-right:2px}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 14px 10px}
.chart-title{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim)}
.lg{display:inline-flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
svg.chart{display:block;width:100%;overflow:visible}
.axis{font-size:10px;fill:var(--text-dim);font-family:var(--mono)}
.grid-line{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface-3);
  border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:9px 12px;
  font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .12s var(--ease);
  white-space:nowrap;line-height:1.6}
.tip.on{opacity:1}
.tip-date{color:var(--text-dim);font-size:11px;margin-bottom:4px;font-family:var(--mono)}
.tip-row{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono)}

.flow-btn{font-size:11px;padding:2px 8px;border-radius:100px;border:1px solid var(--border);
  color:var(--text-dim);background:var(--surface);flex:none;transition:all .15s var(--ease);cursor:pointer}
.flow-btn:hover{border-color:var(--accent-line);color:#a9b0e0;background:var(--accent-dim)}
.flow-btn.active{border-color:var(--accent-line);color:#c3c8f0;background:var(--accent-dim)}
.mode-badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:11px;
  background:var(--accent-dim);border:1px solid var(--accent-line);color:#a9b0e0;flex:none}
.comp-list{margin-top:8px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;max-height:320px;overflow-y:auto}
.comp-item{display:flex;align-items:center;gap:10px;padding:8px 13px;background:var(--surface);
  border-bottom:1px solid var(--border);width:100%;text-align:left;transition:background-color .14s var(--ease)}
.comp-item:last-child{border-bottom:none}
.comp-item:hover{background:var(--surface-2)}
.comp-rank{font-family:var(--mono);font-size:11px;color:var(--text-dim);width:22px;flex:none}
.comp-code{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);flex:none}
.comp-name{font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-val{font-family:var(--mono);font-size:12.5px;font-weight:500;flex:none}
/* P2 排名对比样式 */
.metric-wide{grid-column:1 / -1}
.rank-wrap{display:flex;align-items:center;gap:16px}
.rank-no{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.035em;line-height:1;flex:none}
.rank-no .unit{font-size:13px;color:var(--text-dim);font-weight:400;letter-spacing:0}
.rank-no.up{color:var(--up)} .rank-no.down{color:var(--down)}
.rank-bar-wrap{flex:1;min-width:0}
.rank-bar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-bottom:5px}
.rank-bar i{display:block;height:100%;border-radius:100px;transition:width .4s var(--ease)}
@media (max-width:520px){
  .metric-grid{grid-template-columns:1fr}
  .metric-wide{grid-column:auto}
  .rank-wrap{flex-direction:column;align-items:flex-start;gap:10px}
  .rank-bar-wrap{width:100%}
}


/* ══ 四档资金流按钮 ══ */
.quad-btn{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  height:32px;padding:0 13px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--surface);
  font-size:12.5px;color:var(--text-muted);transition:all .16s var(--ease);
}
.quad-btn:hover{color:#c3c8f0;border-color:var(--accent-line);background:var(--accent-dim)}
.quad-btn[hidden]{display:none}

/* ══ 四档模态面板 ══ */
.q-scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.q-scrim.open{opacity:1;pointer-events:auto}
.q-modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.98);
  width:min(1120px,calc(100vw - 40px));max-height:calc(100vh - 60px);
  background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--r-lg);
  z-index:201;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;pointer-events:none;
  transition:opacity .24s var(--ease),transform .24s var(--ease);
  box-shadow:0 24px 70px rgba(0,0,0,.7);
}
.q-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.q-modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px 22px;border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap;
}
.q-modal-title{font-size:18px;font-weight:600;letter-spacing:-.025em;margin-bottom:6px}
.q-modal-meta{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-modal-tools{display:flex;align-items:center;gap:10px;flex:none}
.q-close{
  width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--text-muted);border:1px solid var(--border);transition:all .16s var(--ease);flex:none;
}
.q-close:hover{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.q-modal-body{padding:18px 22px;overflow-y:auto;flex:1;min-height:0}
.q-modal-note{
  padding:13px 22px;border-top:1px solid var(--border);flex:none;
  font-size:11.5px;color:var(--text-dim);line-height:1.68;
}
.q-modal-note b{color:var(--text-muted)}

.q-chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px 8px;margin-bottom:18px}
.q-chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding:0 4px}
.q-chart-title{font-size:12.5px;color:var(--text-muted)}
.q-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim)}
.q-legend .lg{display:inline-flex;align-items:center;gap:5px}
.q-legend .sw{width:9px;height:9px;border-radius:2px;flex:none}

.q-sum-t{font-size:11.5px;color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;margin:4px 0 10px;font-weight:500}
.q-table{width:100%;border-collapse:collapse;font-size:13px}
.q-table th{
  padding:9px 12px;text-align:right;font-weight:500;font-size:11.5px;
  color:var(--text-dim);border-bottom:1px solid var(--border);white-space:nowrap;
}
.q-table th:first-child,.q-table th:nth-child(2){text-align:left}
.q-table td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.q-table td:first-child{text-align:left}
.q-table tr:last-child td{border-bottom:none}
.q-table tr.q-strong{background:var(--surface)}
.q-table tr.q-strong td{border-top:1px solid var(--border-strong)}
.q-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px}
.q-range{color:var(--text-dim)}
.q-days{color:var(--text-muted)}
.q-bar-cell{width:150px}
.q-track{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.q-track i{display:block;height:100%;border-radius:100px;transition:width .3s var(--ease)}

@media (max-width:760px){
  .q-modal{width:calc(100vw - 20px);max-height:calc(100vh - 24px)}
  .q-modal-head{padding:14px 16px}
  .q-modal-body{padding:14px 16px}
  .q-modal-note{padding:11px 16px}
  .q-bar-cell{width:80px}
  .q-table th,.q-table td{padding:8px;font-size:12px}
}

.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.metric{background:var(--surface);padding:13px 15px}
.metric-l{font-size:11.5px;color:var(--text-dim);margin-bottom:7px}
.metric-v{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.metric-v .unit{font-size:12px;margin-left:1px;color:var(--text-dim)}
.metric-sub{font-size:11px;color:var(--text-dim);margin-top:5px;line-height:1.4}
.metric-bar{height:4px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.metric-bar i{display:block;height:100%;border-radius:100px;transition:width .35s var(--ease)}
.metric-note{font-size:11px;color:var(--text-dim);margin-bottom:18px;text-align:right}
@media (max-width:520px){ .metric-grid{grid-template-columns:1fr} }

.tree-path{margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.tp-t{font-size:11.5px;color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.tp-row{display:flex;gap:12px;padding:7px 0;font-size:13px;align-items:baseline}
.tp-k{color:var(--text-dim);width:36px;flex:none;font-size:12px}
.tp-v{color:var(--text)}
.tp-v em{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--text-dim);margin-left:6px}

footer{border-top:1px solid var(--border);padding:22px 0;font-size:12px;color:var(--text-dim);
  max-width:1400px;margin:0 auto;padding-left:20px;padding-right:20px}

/* P0-2 触控目标：移动端与触屏设备最小 44px */
.flow-btn{min-height:24px;display:inline-flex;align-items:center}
@media (pointer:coarse){
  .flow-btn{padding:0 12px;height:34px;font-size:12px}
  .stock{min-height:52px}
  .l1-head{min-height:54px}
  .l2-head{min-height:50px}
  .l3-head{min-height:48px}
  .btn-sm{height:44px;padding:0 16px}
  .seg button{padding:10px 15px}
  .drawer-close{width:44px;height:44px;top:12px;right:12px}
  .comp-item{min-height:48px}
}

/* P0-3 抽屉内数据免责标识 */
.data-note{
  display:flex;align-items:flex-start;gap:8px;padding:9px 12px;margin-bottom:16px;

<script>
/* ═══════════ 数据 ═══════════ */
/* ═══════════ 数据源：全部来自后端 API ═══════════
   旧实现依赖内嵌 const TREE / data/stocks.json，
   与后端分类（134/346）不一致。现改为运行时从 API 构建。 */

/* 运行时解析 API 基址：避开 const API_BASE 的暂时性死区（TDZ） */
function _apiBase(){
  return (location.protocol === 'file:') ? 'http://127.0.0.1:8000' : '';
}
async function _api(path){
  const r = await fetch(_apiBase() + path).then(function(x){ return x.json(); });
  if (r && r.code !== undefined && r.code !== 0) throw new Error(r.msg || ('code ' + r.code));
  return (r && r.data !== undefined) ? r.data : r;
}

let TREE = [];              // 一/二/三级骨架（由 /industries/tree 构建）
let STOCKS = null;          // { 三级代码: [{code,name,ex,tsCode}] }，按需加载
let ALL_STOCKS = [];        // 扁平索引
let ALL_L2 = [];
let TREE_READY = false;

/* 三级 → 成分股：按需从 /industries/{code}/members 拉取并缓存 */
const _memberCache = new Map();
async function loadMembers(l3code){
  if(_memberCache.has(l3code)) return _memberCache.get(l3code);
  const list = [];
  try{
    // page_size 上限 100，循环拉全
    let page = 1, total = Infinity;
    while(list.length < total && page <= 20){
      const d = await _api('/api/v1/industries/' + l3code +
        '/members?page=' + page + '&page_size=100');
      total = d.total || 0;
      (d.list || []).forEach(x => list.push({
        code: (x.tsCode || '').split('.')[0],
        tsCode: x.tsCode,
        name: x.name,
        ex: (x.tsCode || '').endsWith('.SH') ? '1' : '0'
      }));
      if(!d.list || d.list.length < 100) break;
      page++;
    }
  }catch(e){ /* 无成分或无权限，返回空数组 */ }
  _memberCache.set(l3code, list);
  return list;
}

/* 构建行业树骨架 + 真实成分股计数 */
async function loadTree(){
  const raw = await _api('/api/v1/industries/tree');   // data 即一/二/三级数组
  const arr = Array.isArray(raw) ? raw : (raw.list || []);

  // 成分股数量：/industries 列表接口带真实 memberCount，tree 接口不带
  const counts = new Map();
  try{
    for(const lv of [2,3]){
      const d = await _api('/api/v1/industries?level=' + lv + '&page_size=1000');
      (d.list || []).forEach(x => counts.set(x.swCode, x.memberCount || 0));
    }
  }catch(e){}

  const norm = n => ({
    c: n.swCode || n.sw_code,
    n: n.name,
    k: counts.has(n.swCode || n.sw_code) ? counts.get(n.swCode || n.sw_code) : (n.memberCount || 0)
  });

  TREE = (arr || []).map(l1 => ({
    c: l1.swCode || l1.sw_code,
    n: l1.name,
    l2: (l1.children || []).map(l2 => ({
      c: l2.swCode || l2.sw_code,
      n: l2.name,
      l3: (l2.children || []).map(l3 => norm(l3))
    }))
  }));

  STOCKS = {};               // 改为按需填充
  TREE_READY = true;
  return TREE;
}

/* 按股票代码解析所属行业层级。
   成分股缓存里命中最好；否则从已加载的树里做兜底匹配。 */
function stockIndustry(code, tsCode){
  const want = String(code || '').replace(/\.(SH|SZ|BJ)$/, '');
  const full = tsCode || (want.startsWith('6') ? want + '.SH' : want + '.SZ');

  /* 1) 成分股缓存里精确查（最快） */
  for (const [l3code, list] of _memberCache){
    const hit = (list || []).find(function(x){
      return x.code === want || x.tsCode === full;
    });
    if (hit) return byL3(l3code, hit);
  }

  /* 2) 兜底：只给代码与名称，行业留空（不阻塞抽屉打开） */
  return { code: want, tsCode: full, name: '', ex: full.endsWith('.SH') ? '1' : '0',
           l1: '', l1c: '', l2: '', l2c: '', l3: '', l3c: '' };
}

/* 由三级行业码 + 成分股，补齐一/二/三级名称 */
function byL3(l3code, member){
  for (const l1 of TREE){
    for (const l2 of (l1.l2 || [])){
      for (const l3 of (l2.l3 || [])){
        if (l3.c === l3code){
          return Object.assign({}, member, {
            l1: l1.n, l1c: l1.c, l2: l2.n, l2c: l2.c, l3: l3.n, l3c: l3.c
          });
        }
      }
    }
  }
  return Object.assign({}, member, {l1:'', l1c:'', l2:'', l2c:'', l3:'', l3c:''});
}

/* 统计数字：由加载后的 TREE 推导 */
function treeTotal(){
  let l2 = 0, l3 = 0, st = 0;
  TREE.forEach(a => {
    l2 += (a.l2 || []).length;
    (a.l2 || []).forEach(b => {
      l3 += (b.l3 || []).length;
      (b.l3 || []).forEach(x => { st += (x.k || 0); });
    });
  });
  return { l1: TREE.length, l2, l3, st };
}

/* 兼容旧调用：确保树已加载 */
async function ensureStocks(){
  if(TREE_READY) return;
  await loadTree();
}

/* TOTAL 改为函数：TREE 由 API 异步加载，模块级常量会在加载前求值为空 */
function TOTAL(){
  return treeTotal();
}

/* ═══════════ 模拟资金流 ═══════════ */
function seedOf(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}



/* ═══════════ 工具 ═══════════ */
const yi = v => (v>=0?'+':'') + v.toFixed(2) + '亿';
const fmtAmt = v => (v>=0?'+':'') + v.toFixed(1);
const cls = v => v>0.005?'up':(v<-0.005?'down':'flat');
const exName = e => e==='1'?'上交所':'深交所';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}

/* ═══════════ 树渲染 ═══════════ */
let exFilter = 'all', term = '';

/* ═══════════ 搜索与筛选 ═══════════
   行业名 / 代码 → 本地树匹配（命中该行业即选中其全部成分）
   股票名 / 代码 → 后端 /stocks/search（前端不再持有全量成分股）
   交易所筛选    → 由各三级行业按需加载后精确过滤                */

let _searchToken = 0;                 // 防止异步竞态
let _lastHits = null;                 // 缓存最近一次搜索结果

/* 同步版：仅行业维度匹配，供渲染时即时使用 */
function matchCount(){
  if(!term && exFilter==='all') return null;

  const q = term.toLowerCase().trim();
  const indL1 = new Set(), indL2 = new Set(), indL3 = new Set();
  const codes = new Set();

  if(q){
    TREE.forEach(l1 => {
      const h1 = l1.n.toLowerCase().includes(q) || String(l1.c).includes(q);
      if(h1) indL1.add(l1.c);
      (l1.l2 || []).forEach(l2 => {
        const h2 = l2.n.toLowerCase().includes(q) || String(l2.c).includes(q);
        if(h2) indL2.add(l2.c);
        (l2.l3 || []).forEach(l3 => {
          const h3 = l3.n.toLowerCase().includes(q) || String(l3.c).includes(q);
          if(h3) indL3.add(l3.c);
          if(h1 || h2 || h3) codes.add('__IND__' + l3.c);   // 标记整个三级行业命中
        });
      });
    });
  }

  // 合并上一次 API 搜索到的股票代码
  if(_lastHits && _lastHits.q === q){
    _lastHits.codes.forEach(x => codes.add(x));
  }

  return {codes, indL1, indL2, indL3, pureIndustry:false};
}

/* 异步版：触发一次后端股票搜索，完成后重渲染 */
async function searchStocks(q){
  const my = ++_searchToken;
  q = (q || '').trim();
  if(!q){
    _lastHits = null;
    renderTree();
    return;
  }
  try{
    const d = await apiGet('/api/v1/stocks/search?q=' + encodeURIComponent(q) + '&page=1&page_size=100');
    if(my !== _searchToken) return;                    // 已被更新的搜索取代
    const codes = new Set((d.list || []).map(x => String(x.tsCode || '').split('.')[0]));
    _lastHits = { q: q.toLowerCase(), codes };
  }catch(e){
    if(my !== _searchToken) return;
    _lastHits = null;
  }
  renderTree();
}

/* ═══════════ 树渲染（骨架 + 懒加载股票）═══════════
   首屏只渲染行业骨架（31/131/336 个节点），
   股票列表在三级节点展开时才注入 DOM —— 控制首屏节点数 */
/* 取某三级行业的成分股（异步，带缓存） */
async function stocksOfL3(l3c, q, hits){
  let list = await loadMembers(l3c);          // [{code,name,ex,tsCode}]
  if(exFilter!=='all') list = list.filter(s => s.ex===exFilter);
  if(hits) list = list.filter(s => hits.codes.has(s.code));
  return list;
}

/* 成分股计数：优先用 tree 里的 k（来自 /industries 的 memberCount） */
function countL3(l3c, hits){
  if(hits) return (hits.codesByL3 && hits.codesByL3.get(l3c)) ? hits.codesByL3.get(l3c).size : 0;
  const node = findL3(l3c);
  let n = node ? (node.k || 0) : 0;
  // 交易所筛选时，若已加载过成分股则精确计数，否则沿用总数
  if(exFilter !== 'all' && _memberCache.has(l3c)){
    n = _memberCache.get(l3c).filter(x => x.ex === exFilter).length;
  }
  return n;
}

function findL3(code){
  for(const a of TREE){
    for(const b of (a.l2 || [])){
      for(const x of (b.l3 || [])){
        if(x.c === code) return x;
      }
    }
  }
  return null;
}

/* 把股票列表填入已展开的三级节点（幂等，异步） */
async function fillStocks(l3node){
  if(l3node.dataset.filled === '1') return;
  l3node.dataset.filled = '1';               // 先占位，防并发重入

  const code = l3node.dataset.code;
  const q = term.trim();
  const hits = matchCount();
  const body = l3node.querySelector('.l3-body');
  if(!body) return;

  body.innerHTML = '<div class="stub-empty">加载中…</div>';

  let list = [];
  try{
    list = await stocksOfL3(code, q, hits);
  }catch(e){
    body.innerHTML = '<div class="stub-empty">成分股加载失败：' + esc(e.message) + '</div>';
    l3node.dataset.filled = '0';
    return;
  }

  body.innerHTML = list.length
    ? '<div class="stocks">' + list.map(s =>
        `<button class="stock" data-code="${s.code}" data-name="${esc(s.name)}">
          <span class="stock-code">${s.code}</span>
          <span class="stock-name">${q?hl(s.name,q):esc(s.name)}</span>
          <span class="ex">${s.ex==='1'?'SH':'SZ'}</span>
        </button>`).join('') + '</div>'
    : '<div class="stub-empty">' + ((term || exFilter!=='all') ? '该筛选条件下无股票' : '本行业无当前成分股') + '</div>';
}

/* 递归填充当前所有已展开的三级节点 */
function fillOpenL3(){
  document.querySelectorAll('.l3[data-open="1"]').forEach(fillStocks);
}

function renderTree(){
  const box = document.getElementById('tree');
  const q = term.trim();
  const hits = matchCount();
  const autoOpen = (q || hits) ? '1' : '0';

  const html = TREE.map(l1 => {
    const l2html = l1.l2.map(l2 => {
      const l3html = l2.l3.map(l3 => {
        const cnt = countL3(l3.c, hits);
        if(!cnt) return '';
        return `<div class="l3" data-open="${autoOpen}" data-code="${l3.c}">
          <button class="l3-head" data-toggle aria-expanded="${autoOpen==='1'}">
            <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
            <span class="l3-name">${q?hl(l3.n,q):esc(l3.n)}</span>
            <span class="tag-l3">三级</span>
            <span class="flow-btn" data-flow="l3" data-code="${l3.c}" data-name="${esc(l3.n)}" title="查看行业资金流">资金流</span>
            <span class="count">${cnt} 只</span>
          </button>
          <div class="l3-body"></div>
        </div>`;
      }).join('');

      if(!l3html) return '';
      const l2cnt = l2.l3.reduce((s,l3)=>s+countL3(l3.c, hits),0);
      if(!l2cnt) return '';

      return `<div class="l2" data-open="${autoOpen}">
        <button class="l2-head" data-toggle aria-expanded="${autoOpen==='1'}">
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
          <span class="l2-name">${q?hl(l2.n,q):esc(l2.n)}</span>
          <span class="l2-code">${l2.c}</span>
          <span class="flow-btn" data-flow="l2" data-code="${l2.c}" data-name="${esc(l2.n)}" title="查看行业资金流">资金流</span>
          <span class="count">${l2cnt} 只</span>
        </button>
        <div class="l2-body">${l3html}</div>
      </div>`;
    }).join('');

    if(!l2html) return '';
    const cnt = hits ? hits.codes.size
      : l1.l2.reduce((s,l2)=>s+l2.l3.reduce((t,l3)=>t+countL3(l3.c, null),0),0);

    return `<div class="l1" data-open="${autoOpen}">
      <button class="l1-head" data-toggle aria-expanded="${autoOpen==='1'}">
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        <span class="l1-name">${q?hl(l1.n,q):esc(l1.n)}</span>
        <span class="l1-code">${l1.c}</span>
        <span class="flow-btn" data-flow="l1" data-code="${l1.c}" data-name="${esc(l1.n)}" title="查看行业资金流">资金流</span>
        <span class="count">${cnt} 只</span>
      </button>
      <div class="l1-body">${l2html}</div>
    </div>`;
  }).join('');

  box.innerHTML = html || '<div class="empty">没有匹配的股票或行业</div>';
  document.getElementById('statLine').innerHTML =
    hits ? `匹配 <b>${hits.codes.size}</b> 只股票`
         : (()=>{ const T = TOTAL(); return `<b>${T.l1}</b> 一级 · <b>${T.l2}</b> 二级 · <b>${T.l3}</b> 三级 · <b>${T.st}</b> 只股票`; })();

  // 展开的节点立即填充股票
  fillOpenL3();
}

/* ═══════════ 图表 ═══════════ */
let cur = {code:null, name:null, days:120};

function chartHtml(data, days){
  const W = Math.max(document.getElementById('dBody').clientWidth - 60, 320);
  const H = 250, PL = 52, PR = 14, PT = 12, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxAbs = Math.max(...data.map(d=>Math.abs(d.cum)), 1);
  const maxV = Math.max(...data.map(d=>Math.abs(d.v)), 0.5);

  const x = i => PL + (i/(data.length-1||1))*iw;
  const yCum = v => PT + ih/2 - (v/maxAbs)*(ih/2)*0.92;
  const bw = Math.max(iw/data.length*0.62, 1.2);

  // 柱（每日净流入）
  const bars = data.map((d,i)=>{
    const h = (Math.abs(d.v)/maxV)*(ih/2)*0.88;
    const y = d.v>=0 ? PT+ih/2-h : PT+ih/2;
    const c = d.v>=0 ? 'var(--up)' : 'var(--down)';
    return `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0.6).toFixed(1)}" fill="${c}" opacity=".42"/>`;
  }).join('');

  // 累计折线
  const line = data.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${yCum(d.cum).toFixed(1)}`).join(' ');
  const area = `${line} L${x(data.length-1).toFixed(1)},${(PT+ih/2).toFixed(1)} L${x(0).toFixed(1)},${(PT+ih/2).toFixed(1)} Z`;

  // Y 轴刻度
  const ticks = [-1,-0.5,0,0.5,1].map(f=>{
    const v = maxAbs*f, y = yCum(v);
    return `<text class="axis" x="${PL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${(v>=0?'+':'')+v.toFixed(1)}</text>
            <line class="grid-line" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>`;
  }).join('');

  // X 轴日期
  const xl = [0, Math.floor(data.length/2), data.length-1].map(i=>{
    const d = data[i]; if(!d) return '';
    return `<text class="axis" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.d.slice(5)}</text>`;
  }).join('');

  return `<div class="chart-wrap">
    <div class="chart-title">
      <span>近 ${days} 个交易日资金流</span>
      <span class="chart-legend">
        <span class="lg"><span class="sw" style="background:var(--up)"></span>净流入</span>
        <span class="lg"><span class="sw" style="background:var(--down)"></span>净流出</span>
        <span class="lg"><span class="sw" style="background:#8b93e8"></span>累计</span>
      </span>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="svg">
      ${ticks}
      ${bars}
      <path d="${area}" fill="rgba(139,147,232,.09)"/>
      <path d="${line}" fill="none" stroke="#8b93e8" stroke-width="1.8" stroke-linejoin="round"/>
      <line x1="${PL}" y1="${(PT+ih/2).toFixed(1)}" x2="${W-PR}" y2="${(PT+ih/2).toFixed(1)}" stroke="var(--border-strong)"/>
      ${xl}
      <g id="hitArea">${data.map((d,i)=>`<rect x="${(x(i)-iw/data.length/2).toFixed(1)}" y="${PT}" width="${(iw/data.length).toFixed(1)}" height="${ih}" fill="transparent" data-i="${i}"/>`).join('')}</g>
    </svg>
  </div>`;
}

/* ═══════════ 行业资金流 ═══════════ */
/* 取某行业下所有成分股，汇总其模拟资金流 */
/* 取某行业（L1/L2/L3）下全部成分股 —— 异步，逐三级行业从 API 加载 */
async function stocksOf(level, code){
  const l3list = [];
  TREE.forEach(l1 => {
    if(level==='l1' && l1.c !== code) return;
    (l1.l2 || []).forEach(l2 => {
      if(level==='l2' && l2.c !== code) return;
      (l2.l3 || []).forEach(l3 => {
        if(level==='l3' && l3.c !== code) return;
        l3list.push({ l3, l1, l2 });
      });
    });
  });

  const out = [];
  // 并行加载（限制并发，避免瞬时打爆后端）
  const CONC = 6;
  for(let i = 0; i < l3list.length; i += CONC){
    const batch = l3list.slice(i, i + CONC);
    const res = await Promise.all(batch.map(x =>
      loadMembers(x.l3.c).then(list => ({ x, list })).catch(() => ({ x, list: [] }))
    ));
    res.forEach(({ x, list }) => {
      list.forEach(s => out.push({
        code: s.code, name: s.name, ex: s.ex, tsCode: s.tsCode,
        l1: x.l1.n, l1c: x.l1.c, l2: x.l2.n, l2c: x.l2.c, l3: x.l3.n, l3c: x.l3.c
      }));
    });
  }
  return out;
}

/* 计算专业指标：连续性、波动率、强度、趋势 */
/* 估算个股/行业的日均成交额基准（亿元）—— 用于计算相对强度 */
/* 计算专业指标：连续性、波动率、强度、趋势加速度 */
function metrics(data, amountBase){
  const n = data.length;
  if(!n) return null;
  const net = data.reduce((s,d)=>s+d.v,0);
  const inflow = data.filter(d=>d.v>0).length;
  const outflow = n - inflow;
  const avg = net / n;
  const variance = data.reduce((s,d)=>s+Math.pow(d.v-avg,2),0) / n;
  const sd = Math.sqrt(variance);

  // 最大连续净流入 / 净流出天数
  let maxIn = 0, maxOut = 0, curIn = 0, curOut = 0;
  data.forEach(d=>{
    if(d.v > 0){ curIn++; curOut = 0; } else { curOut++; curIn = 0; }
    if(curIn > maxIn) maxIn = curIn;
    if(curOut > maxOut) maxOut = curOut;
  });

  // 当前连续状态（从最新往前数）
  let streak = 0, streakDir = 0;
  for(let i = n-1; i >= 0; i--){
    const dir = data[i].v > 0 ? 1 : -1;
    if(streakDir === 0){ streakDir = dir; streak = 1; }
    else if(dir === streakDir) streak++;
    else break;
  }

  // 动能：近 5 日 vs 前 5 日
  const last5 = data.slice(-5).reduce((s,d)=>s+d.v,0);
  const prev5 = data.slice(-10,-5).reduce((s,d)=>s+d.v,0);
  const momentum = last5 - prev5;

  // P2 新增：趋势加速度 —— 比较后半段与前半段的日均
  const half = Math.floor(n/2);
  const firstHalfAvg = half ? data.slice(0, half).reduce((s,d)=>s+d.v,0) / half : 0;
  const secondHalfAvg = (n-half) ? data.slice(half).reduce((s,d)=>s+d.v,0) / (n-half) : 0;
  const accel = secondHalfAvg - firstHalfAvg;

  // P2 新增：累计曲线斜率（线性回归，单位：亿元/日）
  let sx=0, sy=0, sxy=0, sxx=0;
  data.forEach((d,i)=>{ sx+=i; sy+=d.cum; sxy+=i*d.cum; sxx+=i*i; });
  const denom = n*sxx - sx*sx;
  const slope = denom ? (n*sxy - sx*sy) / denom : 0;

  // P2 新增：相对强度 = 净流入 / 区间成交额
  const strength = amountBase ? net / amountBase : null;

  // P2 新增：净流入占成交额比（百分比形式，更直观）
  const strengthPct = (strength !== null) ? strength * 100 : null;

  // 最大回撤（累计曲线）
  let peak = -Infinity, maxDD = 0;
  data.forEach(d=>{
    if(d.cum > peak) peak = d.cum;
    const dd = peak - d.cum;
    if(dd > maxDD) maxDD = dd;
  });

  return {
    net, inflow, outflow, avg, sd, maxIn, maxOut, streak, streakDir,
    last5, momentum, strength, strengthPct, accel, slope, maxDD,
    winRate: inflow / n,
    vol: sd / (Math.abs(avg) || 1)
  };
}

/* 计算某指标在全体样本中的百分位排名（0-100） */
function percentileRank(value, allValues){
  if(!allValues || !allValues.length) return null;
  const sorted = [...allValues].sort((a,b)=>a-b);
  let lo = 0, hi = sorted.length;
  while(lo < hi){ const mid = (lo+hi)>>1; if(sorted[mid] < value) lo = mid+1; else hi = mid; }
  return lo / sorted.length * 100;
}

/* 全市场二级行业强度排名（用于对比） */
/* 全市场强度排名：按时间范围分键缓存，避免重复聚合 */
const _rankCache = new Map();
function period1Days(){ return cur.days || 120; }

function metricBlock(m, days, opts){
  if(!m) return '';
  const lbl = days<=20?'近1月':(days<=60?'近3月':(days<=120?'近6月':'近1年'));
  const streakTxt = m.streakDir > 0
    ? `<span class="up">连续 ${m.streak} 天净流入</span>`
    : `<span class="down">连续 ${m.streak} 天净流出</span>`;
  const momCls = m.momentum > 0 ? 'up' : 'down';
  const accelCls = m.accel > 0 ? 'up' : 'down';
  const slopeCls = m.slope > 0 ? 'up' : 'down';

  // P2 相对强度
  const strengthHtml = m.strengthPct !== null
    ? `<div class="metric-v ${cls(m.strengthPct)}">${m.strengthPct>=0?'+':''}${m.strengthPct.toFixed(2)}<span class="unit">%</span></div>
       <div class="metric-sub">净流入 ÷ 区间成交额</div>`
    : `<div class="metric-v flat" style="font-size:14px">—</div><div class="metric-sub">数据不足</div>`;

  // P2 排名对比（仅行业层级）—— 先占位，异步填充以避免阻塞
  let rankHtml = '';
  if(opts && opts.isIndustry && opts.code){
    const cached = _rankCache.get(period1Days());
    if(cached){
      rankHtml = rankBlockHtml(cached, opts.code);
    } else {
      rankHtml = `<div class="metric metric-wide" id="rankSlot">
        <div class="metric-l">全市场强度排名</div>
        <div class="metric-sub">正在计算…</div></div>`;
      setTimeout(()=>{
        const slot = document.getElementById('rankSlot');
        if(!slot) return;
        const rk = marketRank();
        slot.outerHTML = rankBlockHtml(rk, opts.code) ||
          '<div class="metric metric-wide"><div class="metric-l">全市场强度排名</div><div class="metric-sub">数据不足</div></div>';
      }, 30);
    }
  }

  return `
    <div class="metric-grid">
      <div class="metric">
        <div class="metric-l">净流入天数占比</div>
        <div class="metric-v">${(m.winRate*100).toFixed(1)}<span class="unit">%</span></div>
        <div class="metric-bar"><i style="width:${(m.winRate*100).toFixed(1)}%;background:var(--up)"></i></div>
      </div>
      <div class="metric">
        <div class="metric-l">当前状态</div>
        <div class="metric-v" style="font-size:15px">${streakTxt}</div>
        <div class="metric-sub">最长连续流入 ${m.maxIn} 天 / 流出 ${m.maxOut} 天</div>
      </div>
      <div class="metric">
        <div class="metric-l">相对强度</div>
        ${strengthHtml}
      </div>
      <div class="metric">
        <div class="metric-l">趋势加速度</div>
        <div class="metric-v ${accelCls}">${yi(m.accel)}</div>
        <div class="metric-sub">后半段日均 − 前半段日均</div>
      </div>
      <div class="metric">
        <div class="metric-l">日均净流入</div>
        <div class="metric-v ${cls(m.avg)}">${yi(m.avg)}</div>
        <div class="metric-sub">波动率 ${(m.vol*100).toFixed(0)}%</div>
      </div>
      <div class="metric">
        <div class="metric-l">近 5 日动能</div>
        <div class="metric-v ${momCls}">${yi(m.momentum)}</div>
        <div class="metric-sub">较前 5 日的增减</div>
      </div>
    </div>
    ${rankHtml}
    <div class="metric-note">基于 ${lbl}（${days} 个交易日）计算 · 斜率 ${fmtAmt(m.slope)}亿/日 · 最大回撤 ${Math.abs(m.maxDD).toFixed(1)}亿</div>
  `;
}

function rankBlockHtml(rk, code){
  const vals = [...rk.values()].map(v=>v.strength);
  const self = rk.get(code);
  if(!self || vals.length <= 5) return '';
  const pr = percentileRank(self.strength, vals);
  const rankNo = vals.filter(v=>v > self.strength).length + 1;
  return `
    <div class="metric metric-wide">
      <div class="metric-l">全市场强度排名（共 ${vals.length} 个二级行业）</div>
      <div class="rank-wrap">
        <div class="rank-no ${percentileCls(pr)}">${rankNo}<span class="unit">/${vals.length}</span></div>
        <div class="rank-bar-wrap">
          <div class="rank-bar"><i style="width:${pr.toFixed(1)}%;background:${percentileColor(pr)}"></i></div>
          <div class="metric-sub">强于 ${pr.toFixed(0)}% 的二级行业 · 按「净流入÷成交额」计算</div>
        </div>
      </div>
    </div>`;
}
function percentileCls(p){ return p >= 66 ? 'up' : (p >= 33 ? '' : 'down'); }
function percentileColor(p){
  return p >= 66 ? 'var(--up)' : (p >= 33 ? 'var(--accent)' : 'var(--down)');
}

/* ═══════════ 四档资金流（独立面板）═══════════
   口径：按单笔成交金额划分（开源证券研报标准）
     小单 <4万   中单 4-20万   大单 20-100万   超大单 >100万
   约束：四档净额之和恒为 0 —— 主力(大+超大) 与 散户(小+中) 互为相反数 */
const _quadCache = new Map();
const QCOLOR = {sm:'var(--q-sm)', md:'var(--q-md)', lg:'var(--q-lg)', elg:'var(--q-elg)'};
const QNAME  = {sm:'小单', md:'中单', lg:'大单', elg:'超大单'};
const QRANGE = {sm:'< 4万', md:'4-20万', lg:'20-100万', elg:'> 100万'};

/* 金额自适应精度：小数值保留更多小数位 */
function fmtSmall(v){
  const a = Math.abs(v);
  const dp = a >= 1 ? 2 : (a >= 0.01 ? 3 : 4);
  return (v >= 0 ? '+' : '') + v.toFixed(dp) + '亿';
}

function axisNum(v){
  const a = Math.abs(v);
  const dp = a >= 10 ? 0 : (a >= 1 ? 1 : (a >= 0.1 ? 2 : 3));
  return (v >= 0 ? '+' : '') + v.toFixed(dp);
}

let qMode = 'main';
let quadCtx = null;

function quadChart(data, mode){
  const wrapEl = document.getElementById('qWrap');
  const W = Math.max((wrapEl ? wrapEl.clientWidth : 900) - 44, 360);
  const H = 300, PL = 62, PR = 18, PT = 18, PB = 30;
  const iw = W - PL - PR, ih = H - PT - PB;
  const y0 = PT + ih/2;
  const step = iw / data.length;
  let body = '', ticks = '', extra = '';

  if(mode === 'main'){
    const maxAbs = Math.max.apply(null, data.map(function(x){return Math.abs(x.main);}).concat([0.05]));
    const bw = Math.max(step*0.62, 2.2);

    body = data.map(function(x,i){
      const m = x.main, rt = x.retail;
      const hm = Math.abs(m)/maxAbs*(ih/2)*0.92;
      const hr = Math.abs(rt)/maxAbs*(ih/2)*0.92;
      const cx = PL + step*i + step/2;
      const my = m>=0 ? y0-hm : y0;
      const ry = rt>=0 ? y0-hr : y0;
      return '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+my.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(hm,0.4).toFixed(1)+'" fill="'+QCOLOR.lg+'" opacity=".92" rx="1"/>' +
             '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+ry.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(hr,0.4).toFixed(1)+'" fill="'+QCOLOR.sm+'" opacity=".5" rx="1"/>';
    }).join('');

    const maN = Math.min(20, Math.max(3, Math.floor(data.length/3)));
    const maPts = data.map(function(x,i){
      const sl = data.slice(Math.max(0,i-maN+1), i+1);
      const avg = sl.reduce(function(s,v){return s+v.main;},0)/sl.length;
      return (PL+step*i+step/2).toFixed(1)+','+(y0-(avg/maxAbs)*(ih/2)*0.92).toFixed(1);
    }).join(' ');
    extra = '<polyline points="'+maPts+'" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".85"/>';

    ticks = [-1,-0.5,0,0.5,1].map(function(f){
      const v = maxAbs*f, y = y0 - (v/maxAbs)*(ih/2)*0.92;
      return '<text class="axis" x="'+(PL-9)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+axisNum(v)+'</text>' +
             '<line class="grid" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"/>';
    }).join('');

  } else {
    const keys = ['sm','md','lg','elg'];
    const ck = {sm:'cumSm', md:'cumMd', lg:'cumLg', elg:'cumElg'};
    const all = [];
    data.forEach(function(x){ keys.forEach(function(k){ all.push(x[ck[k]]); }); });
    const hi = Math.max.apply(null, all.concat([0.1]));
    const lo = Math.min.apply(null, all.concat([-0.1]));
    const pad = (hi-lo)*0.08 || 1;
    const top = hi+pad, bot = lo-pad;
    const yOf = function(v){ return PT + ih - ((v-bot)/(top-bot))*ih; };
    const xOf = function(i){ return PL + (i/(data.length-1||1))*iw; };

    body = keys.map(function(k){
      const pts = data.map(function(x,i){ return xOf(i).toFixed(1)+','+yOf(x[ck[k]]).toFixed(1); }).join(' ');
      return '<polyline points="'+pts+'" fill="none" stroke="'+QCOLOR[k]+'" stroke-width="2" stroke-linejoin="round"/>';
    }).join('');

    ticks = [0,.25,.5,.75,1].map(function(f){
      const v = bot + (top-bot)*f, y = yOf(v);
      return '<text class="axis" x="'+(PL-9)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+axisNum(v)+'</text>' +
             '<line class="grid" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"/>';
    }).join('');
  }

  const xl = [0, Math.floor(data.length/2), data.length-1].map(function(i){
    const d = data[i]; if(!d) return '';
    const cx = mode==='main' ? PL + step*i + step/2 : PL + (i/(data.length-1||1))*iw;
    return '<text class="axis" x="'+cx.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+d.d.slice(5)+'</text>';
  }).join('');

  const maLabel = Math.min(20, Math.max(3, Math.floor(data.length/3)));
  const legend = mode==='main'
    ? '<span class="lg"><span class="sw" style="background:'+QCOLOR.lg+'"></span>主力（大单+超大单）</span>' +
      '<span class="lg"><span class="sw" style="background:'+QCOLOR.sm+';opacity:.5"></span>散户（小单+中单）</span>' +
      '<span class="lg"><span class="sw" style="background:#fff"></span>主力 '+maLabel+' 日均线</span>'
    : ['sm','md','lg','elg'].map(function(k){
        return '<span class="lg"><span class="sw" style="background:'+QCOLOR[k]+'"></span>'+QNAME[k]+'</span>';
      }).join('');

  return '<div class="q-chart-wrap" id="qWrap">' +
    '<div class="q-chart-head">' +
      '<span class="q-chart-title">'+(mode==='main' ? '主力 vs 散户（每日净额）' : '四档累计净流入')+'</span>' +
      '<span class="q-legend">'+legend+'</span>' +
    '</div>' +
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" id="qsvg">' +
      ticks +
      (mode==='main' ? '<line class="zero" x1="'+PL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y0.toFixed(1)+'"/>' : '') +
      body + extra + xl +
      '<g id="qhit">' + data.map(function(x,i){
        return '<rect x="'+(PL+step*i).toFixed(1)+'" y="'+PT+'" width="'+step.toFixed(1)+'" height="'+ih+'" fill="transparent" data-qi="'+i+'"/>';
      }).join('') + '</g>' +
    '</svg></div>';
}

function quadSummary(data){
  const keys = ['sm','md','lg','elg'];
  const rows = keys.map(function(k){
    const vals = data.map(function(x){return x[k];});
    return {k:k, net: vals.reduce(function(a,b){return a+b;},0), up: vals.filter(function(v){return v>0;}).length};
  });
  const mainNet = rows[2].net + rows[3].net;
  const retNet  = rows[0].net + rows[1].net;
  const mainUp  = data.filter(function(x){return x.main>0;}).length;
  const maxAbs  = Math.max.apply(null, rows.map(function(r){return Math.abs(r.net);}).concat([0.01]));

  function line(label, range, net, up, color, strong){
    const w = (Math.abs(net)/maxAbs*100).toFixed(1);
    return '<tr'+(strong?' class="q-strong"':'')+'>' +
      '<td><span class="q-dot" style="background:'+color+'"></span>'+label+'</td>' +
      '<td class="num q-range">'+range+'</td>' +
      '<td class="num '+cls(net)+'" style="font-weight:600">'+yi(net)+'</td>' +
      '<td class="num">'+fmtSmall(net/data.length)+'</td>' +
      '<td class="num q-days">'+up+' / '+data.length+'</td>' +
      '<td class="q-bar-cell"><div class="q-track"><i style="width:'+w+'%;background:'+color+'"></i></div></td>' +
    '</tr>';
  }

  return '<table class="q-table">' +
    '<thead><tr><th>档位</th><th>金额区间</th><th>区间净流入</th><th>日均</th><th>净流入天数</th><th>占比</th></tr></thead><tbody>' +
      line('小单', QRANGE.sm, rows[0].net, rows[0].up, QCOLOR.sm, false) +
      line('中单', QRANGE.md, rows[1].net, rows[1].up, QCOLOR.md, false) +
      line('大单', QRANGE.lg, rows[2].net, rows[2].up, QCOLOR.lg, false) +
      line('超大单', QRANGE.elg, rows[3].net, rows[3].up, QCOLOR.elg, false) +
      line('主力（大单+超大单）', '≥ 20万', mainNet, mainUp, QCOLOR.lg, true) +
      line('散户（小单+中单）', '< 20万', retNet, data.length-mainUp, QCOLOR.sm, true) +
    '</tbody></table>';
}

/* 焦点陷阱：抽屉打开时 Tab 循环限制在抽屉内 */
function trapFocus(e){
  if(e.key !== 'Tab') return;
  const drawer = document.getElementById('drawer');
  if(!drawer.classList.contains('open')) return;
  const focusables = [...drawer.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )].filter(el => el.offsetParent !== null);
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* Escape 关闭 + 树内键盘导航 */
function treeKeydown(e){
  if(e.key === 'Escape'){
    if(document.getElementById('qModal').classList.contains('open')){ closeQuad(); return; }
    closeDrawer(); return;
  }
  const head = e.target.closest && e.target.closest('[data-toggle]');
  if(!head) return;
  const node = head.parentElement;
  const heads = [...document.querySelectorAll('.l1-head, .l2-head, .l3-head')]
    .filter(h => h.offsetParent !== null);
  const idx = heads.indexOf(head);
  if(e.key === 'ArrowDown'){ e.preventDefault(); heads[Math.min(idx+1, heads.length-1)]?.focus(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); heads[Math.max(idx-1, 0)]?.focus(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); if(node.dataset.open !== '1') head.click(); }
  else if(e.key === 'ArrowLeft'){
    e.preventDefault();
    if(node.dataset.open === '1') head.click();
    else node.parentElement?.querySelector(':scope > [data-toggle]')?.focus();
  }
}

/* ═══════════ 真实资金流接入（覆盖上方 mock 定义）═══════════ */
const API_BASE = (location.protocol === 'file:') ? 'http://127.0.0.1:8000' : '';
let DATA_DATE = null;

async function apiGet(path){
  const r = await fetch(API_BASE + path).then(x => x.json());
  if(r.code !== 0) throw new Error(r.msg || '数据接口错误');
  return r.data;
}

function cumulate(arr){
  let c = 0;
  arr.forEach(x => { c += (x.v || 0); x.cum = c; });
  return arr;
}

/* 6 位代码 -> ts_code（带交易所后缀）；已带后缀则原样返回 */
function tsCode(code){
  if(!code) return code;
  if(/\.(SH|SZ|BJ)$/.test(code)) return code;
  if(/^[69]/.test(code)) return code + '.SH';
  if(/^[023]/.test(code)) return code + '.SZ';
  return code + '.BJ';
}
/* ts_code -> 6 位代码 */
function bareCode(code){
  return (code || '').replace(/\.(SH|SZ|BJ)$/, '');
}

/* 个股资金流序列（真实） */
async function genSeries(code, name, days){
  const ck = code + '|' + days;
  if(_seriesCache.has(ck)) return _seriesCache.get(ck);
  const p = (async () => {
    try {
      const d = await apiGet('/api/v1/stocks/' + tsCode(code) + '/flow');
      return cumulate((d.series || []).slice(-days).map(x => ({d:x.d, v:x.net ?? 0})));
    } catch(e){ return []; }
  })();
  _seriesCache.set(ck, p);
  return p;
}

/* 行业资金流（真实数据；L1/L2/L3 均已聚合） */
async function aggregate(comp, days){
  const code = (comp && comp[0]) ? (comp[0].l2c || comp[0].l3c || comp[0].l1c) : null;
  if(!code) return [];
  try {
    const d = await apiGet('/api/v1/industries/' + code + '/flow');
    return cumulate((d.series || []).slice(-days).map(x => ({d:x.d, v:x.net ?? 0})));
  } catch(e){ return []; }
}

/* 四档资金流（真实） */
async function genQuad(code, name, days){
  const ck = code + '|q|' + days;
  if(_quadCache.has(ck)) return _quadCache.get(ck);
  const p = (async () => {
    try {
      const d = await apiGet('/api/v1/stocks/' + tsCode(code) + '/flow');
      const base = (d.series || []).slice(-days);
      let acc = {sm:0, md:0, lg:0, elg:0};
      return base.map(x => {
        acc.sm += (x.sm||0); acc.md += (x.md||0); acc.lg += (x.lg||0); acc.elg += (x.elg||0);
        return { d:x.d, sm:+((x.sm||0).toFixed(4)), md:+((x.md||0).toFixed(4)),
                 lg:+((x.lg||0).toFixed(4)), elg:+((x.elg||0).toFixed(4)),
                 main:+(((x.lg||0)+(x.elg||0)).toFixed(4)), retail:+(((x.sm||0)+(x.md||0)).toFixed(4)),
                 cumSm:+acc.sm.toFixed(4), cumMd:+acc.md.toFixed(4),
                 cumLg:+acc.lg.toFixed(4), cumElg:+acc.elg.toFixed(4),
                 cumMain:+((acc.lg+acc.elg).toFixed(4)) };
      });
    } catch(e){ return []; }
  })();
  _quadCache.set(ck, p);
  return p;
}

      series = cumulate(raw.map(x => ({d:x.d, v:x.net ?? 0})));
      turnover = raw.reduce((s,x)=>s+(x.turnover||0), 0);
    } catch(e){ series = []; }
  }

  let compHtml = '', topCount = 0;
  { /* L1/L2/L3 统一处理 */
    try {
      const sf = await apiGet('/api/v1/industries/' + code + '/stocks-flow?limit=40');
      topCount = (sf.list || []).length;
      compHtml = (sf.list || []).map((s,i) =>
        '<button class="comp-item" data-code="' + bareCode(s.tsCode) + '" data-name="' + esc(s.name) + '">' +
          '<span class="comp-rank">' + (i+1) + '</span>' +
          '<span class="comp-code">' + s.tsCode + '</span>' +
          '<span class="comp-name">' + esc(s.name) + '</span>' +
          '<span class="comp-val ' + cls(s.net) + '">' + yi(s.net) + '</span>' +
        '</button>').join('');
    } catch(e){ compHtml = ''; }
  }

  const net = series.reduce((s,d)=>s+d.v,0);
  const inflowDays = series.filter(d=>d.v>0).length;
  const best = series.reduce((a,b)=>Math.abs(b.v)>Math.abs(a.v)?b:a, {d:'', v:0, cum:0});
  const maxCum = Math.max(0, ...series.map(d=>d.cum));
  const minCum = Math.min(0, ...series.map(d=>d.cum));
  const ranges = [[20,'近1月'],[60,'近3月'],[120,'近6月'],[242,'近1年']];
  const rangeBtns = ranges.map(([n,label])=>'<button data-days="'+n+'" aria-pressed="'+(days===n)+'">'+label+'</button>').join('');

  const note = '<div class="data-note">✅ 真实数据' + (DATA_DATE ? ' · 数据日期 ' + DATA_DATE : '') + '　·　不构成投资建议</div>';

  box.innerHTML =
    note +
    '<div class="range-bar">' +
      '<span class="lbl">时间范围</span>' +
      '<div class="seg" id="rangeSegI">' + rangeBtns + '</div>' +
      '<span class="lbl" style="margin-left:auto">' + series.length + ' 个交易日</span>' +
    '</div>' +
    '<div class="sum">' +
      '<div class="sum-c"><div class="sum-l">区间净流入合计</div><div class="sum-v ' + cls(net) + '">' + yi(net) + '</div></div>' +
      '<div class="sum-c"><div class="sum-l">净流入天数</div><div class="sum-v">' + inflowDays + ' <span style="font-size:13px;color:var(--text-dim)">/ ' + series.length + ' 天</span></div></div>' +
      '<div class="sum-c"><div class="sum-l">单日最大净流入</div><div class="sum-v ' + cls(best.v) + '">' + yi(best.v) + '</div></div>' +
      '<div class="sum-c"><div class="sum-l">累计峰值 / 谷值</div><div class="sum-v" style="font-size:15px"><span class="up">' + yi(maxCum) + '</span> <span style="color:var(--text-dim)">/</span> <span class="down">' + yi(minCum) + '</span></div></div>' +
    '</div>' +
    metricBlock(metrics(series, turnover), days, {isIndustry:true, code:code}) +
    chartHtml(series, days) +
    '<div class="sec-t">成分股区间净流入排行（前 ' + topCount + ' 只）</div>' +
    '<div class="comp-list">' + (compHtml || '<div class="empty">暂无数据</div>') + '</div>';

  bindChart(series);
}

async function openIndustry(level, code, name){
  const lvName = level==='l1' ? '一级行业' : (level==='l2' ? '二级行业' : '三级行业');

  /* 面包屑从已加载的树里取，不再加载整个行业的成分股 */
  const crumbs = industryBreadcrumb(level, code);
  const self = crumbs.length ? crumbs[crumbs.length - 1] : null;

  curIndustry = { level, code, name, crumbs };

  document.getElementById('dTitle').textContent = name;
  document.getElementById('dMeta').innerHTML =
    '<span class="mode-badge">' + lvName + '</span>' +
    '<span class="num">' + code + '</span>' +
    (self && self.memberCount != null ? '<span>成分股 ' + self.memberCount + ' 只</span>' : '') +
    '<span style="color:var(--border-strong)">|</span>' +
    crumbs.map(function(x){ return '<span>' + esc(x.name) + '</span>'; })
          .join('<span style="color:var(--text-dim)">›</span>');

  document.getElementById('quadBtn').hidden = true;

  _lastFocus = document.activeElement;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('dClose').focus();

  await renderIndustryBody();
}

/* 从树中解析行业面包屑：[{name, code, memberCount}] */
function industryBreadcrumb(level, code){
  for(const l1 of TREE){
    if(level === 'l1' && l1.c === code) return [{name:l1.n, code:l1.c, memberCount:l1.k}];
    for(const l2 of (l1.l2 || [])){
      if(level === 'l2' && l2.c === code)
        return [{name:l1.n, code:l1.c}, {name:l2.n, code:l2.c, memberCount:l2.k}];
      for(const l3 of (l2.l3 || [])){
        if(level === 'l3' && l3.c === code)
          return [{name:l1.n, code:l1.c}, {name:l2.n, code:l2.c}, {name:l3.n, code:l3.c, memberCount:l3.k}];
      }
    }
  }
  return [];
}

/* 数据状态条：依据真实 API 结果渲染，数字全部来自 /meta */
function renderDataBar(ok, meta){
  const bar = document.getElementById('dataBar');
  const ico = document.getElementById('dataBarIcon');
  const txt = document.getElementById('dataBarText');
  if(!bar) return;

  if(ok && meta){
    const range = (meta.dataStart && meta.dataEnd)
      ? (meta.dataStart + ' ~ ' + meta.dataEnd)
      : (meta.dataEnd || '—');
    bar.className = 'warn ok';
    ico.textContent = '✓';
    /* 只陈述资金流数据日期，不列行业数量
       （行业树使用页面内嵌快照，与后端分类存在少量差异，列数量会造成矛盾） */
    txt.innerHTML = '<b>真实数据</b>　资金流数据日期 <span class="num">' +
      (meta.dataEnd || '—') + '</span>' +
      '　·　数据区间 ' + range +
      '　·　数据源 Tushare 兼容代理';
  } else {
    bar.className = 'warn err';
    ico.textContent = '⚠';
    txt.innerHTML = '<b>后端未连接</b>　未能获取 /api/v1/meta，' +
      '个股资金流不可用。请确认后端已在 <span class="num">127.0.0.1:8000</span> 启动。';
  }
}
